<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            min-height: 100vh;
        }

        /* Tela de Login */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #080808;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 10px;
            text-align: center;
        }

        .login-box h2 {
            color: white;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 5px;
            color: white;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-box button:hover {
            background: #ccc;
        }

        #error {
            color: #ff4444;
            font-size: 13px;
            margin-top: 15px;
        }

        /* Tela Preta */
        #black-screen {
            display: none;
            min-height: 100vh;
            width: 100%;
            background: #000;
            position: relative;
        }

        .logout {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #181818;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Admin Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Utilizador"
            >

            <input
                type="password"
                id="password"
                placeholder="Palavra-passe"
            >

            <button onclick="login()">ENTRAR</button>

            <p id="error"></p>
        </div>
    </div>

    <!-- TELA PRETA -->
    <div id="black-screen">
        <button class="logout" onclick="logout()">
            Terminar sessão
        </button>
    </div>

    <script>
        // Credenciais de demonstração
        const ADMIN_USER = "admin";
        const ADMIN_PASSWORD = "123456";

        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (
                username === ADMIN_USER &&
                password === ADMIN_PASSWORD
            ) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("black-screen").style.display = "block";
            } else {
                document.getElementById("error").textContent =
                    "Credenciais incorretas!";
            }
        }

        function logout() {
            document.getElementById("black-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";

            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("error").textContent = "";
        }
    </script>

</body>
</html>
